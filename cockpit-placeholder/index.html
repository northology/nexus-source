<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nexus</title>
<style>
  :root { --ground: #F5F5F3; --ink: #111111; --g2: #5C5C59; --rule: #D9D9D5; --signal: #E63B2E; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --ground: #141414; --ink: #EDEDEA; --g2: #9B9B97; --rule: #2E2E2D; --signal: #FF5A4B; color-scheme: dark; } }
  body { margin: 0; padding: 40px 48px; background: var(--ground); color: var(--ink); font: 14px/1.5 system-ui, sans-serif; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p { color: var(--g2); margin: 0 0 24px; max-width: 68ch; }
  ul { list-style: none; padding: 0; max-width: 760px; }
  li { padding: 10px 0; border-bottom: 1px solid var(--rule); }
  .needs { color: var(--signal); }
  code { font-family: ui-monospace, monospace; font-size: 12px; }
</style>
</head>
<body>
<h1>nexus</h1>
<p>The full cockpit is not built yet. This page lists what the server sees, so the gate round trip can be tested.</p>
<ul id="out"><li>Loading…</li></ul>
<script>
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  async function load() {
    const out = document.getElementById('out');
    try {
      const { builds } = await (await fetch('/api/builds')).json();
      if (!builds.length) { out.innerHTML = '<li>No build in this checkout yet.</li>'; return; }
      const rows = [];
      for (const b of builds) {
        const s = await (await fetch('/api/builds/' + encodeURIComponent(b))).json();
        rows.push('<li><strong>' + esc(b) + '</strong> · ' + esc(s.build ? s.build.stage : 'unreadable build.json') + '</li>');
        for (const g of s.gates) {
          const state = g.answers ? 'answered' : '<span class="needs">open</span>';
          rows.push('<li>' + state + ' · gate <code>' + esc(g.name) + '</code> (' + esc(g.request.type) + '): ' + esc(g.request.title) + '</li>');
        }
        for (const p of s.problems) rows.push('<li class="needs">' + esc(p.file) + ': ' + esc(p.message) + '</li>');
      }
      out.innerHTML = rows.join('');
    } catch {
      out.innerHTML = '<li class="needs">Could not reach the nexus server.</li>';
    }
  }
  load();
  new EventSource('/api/events').addEventListener('change', load);
</script>
</body>
</html>
